  catalog, no sandbox, no changelog, no status page and no security.txt. The only
  machine-readable surface is the OpenID Connect discovery behind the Lineage Link
  customer portal (Auth0 tenant lineage-ciam.us.auth0.com via ciam.lineageapps.com)
  and the Lineage Link Help community (Salesforce Experience Cloud).
