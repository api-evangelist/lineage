aid: lineage
name: Lineage
description: 'Lineage, Inc. (Nasdaq: LINE) is the world''s largest temperature-controlled
  warehousing and logistics REIT, operating a global cold-chain network of more than
  480 facilities across North America, Europe and Asia-Pacific. It provides cold storage
  and automated warehousing, blast freezing, food manufacturing and processing support,
  direct-to-consumer fulfillment, and an integrated transportation arm spanning freight
  forwarding, customs brokerage, drayage, temperature-controlled rail, managed transportation
  and multi-vendor consolidation. Its customer-facing technology is Lineage Link, a
  supply chain platform providing real-time visibility into inventory, orders, appointments
  and shipment status across the facility network, supported by proprietary systems
  including the Sybil warehouse-optimization algorithm and the Lineage Eye computer-vision
  receiving system. Lineage publishes no public API, developer portal or API documentation
  as of 2026-07-19; customer integration runs through Lineage Link and account teams
  rather than a self-service developer program. This profile therefore captures the
  verified identity, discovery and domain-security surface rather than an API contract.'
